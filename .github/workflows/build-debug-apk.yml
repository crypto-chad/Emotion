name: Build debug APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install NDK and CMake
        run: sdkmanager --install "ndk;21.4.7075529" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Content-based compiler cache: reused objects don't depend on file mtimes,
      # which a fresh checkout always resets (that defeated caching .cxx).
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ndk21-v2
          max-size: 2G

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Inject Telegram API credentials
        if: ${{ env.TG_API_ID != '' && env.TG_API_HASH != '' }}
        run: |
          FILE=TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          sed -i "s/public static int APP_ID = .*/public static int APP_ID = ${TG_API_ID};/" "$FILE"
          sed -i "s/public static String APP_HASH = .*/public static String APP_HASH = \"${TG_API_HASH}\";/" "$FILE"

      - name: Build debug APK
        env:
          USE_CCACHE: 'true'
          # sdkmanager reinstalls the NDK on every runner, and ccache hashes the
          # compiler's mtime by default, so every call missed (0/8060 hits).
          CCACHE_COMPILERCHECK: string:ndk-21.4.7075529
          CCACHE_NOHASHDIR: 'true'
          CCACHE_SLOPPINESS: time_macros
        run: ./gradlew :TMessagesProj_App:assembleAfatDebug -PAPP_VERSION_CODE=${{ github.run_number }} --no-daemon --stacktrace --build-cache

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find TMessagesProj_App/build/outputs/apk -name "*.apk" | head -n 1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      # One release per build with a unique tag, so update checkers such as
      # Obtainium (which compare the tag) see a new version every time.
      - name: Publish debug release
        uses: ncipollo/release-action@v1
        with:
          tag: build-${{ github.run_number }}
          commit: ${{ github.sha }}
          name: "Debug build #${{ github.run_number }}"
          body: "Automatic debug build from commit ${{ github.sha }}"
          makeLatest: true
          artifacts: ${{ steps.apk.outputs.path }}

      - name: Prune old debug releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-debug --cleanup-tag --yes || true
          gh release list --limit 100 --json tagName --jq '.[].tagName' | grep '^build-' | tail -n +6 | xargs -r -n1 gh release delete --cleanup-tag --yes
